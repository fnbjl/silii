<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='70'>🐟︎</text></svg>">
<title>一键搜索</title>
<style>
body { max-width:920px; margin:6px auto; padding:0 14px; font-size:16px; }
.tip { text-align:center; margin:6px 0; }
.divider { border-bottom:1px solid #aaa; margin-bottom:20px; }
.group-title { font-weight:bold; font-size:17px; margin-top:28px; display:none; }
.item { margin: 9px 0; cursor: pointer; color:#0000cc; line-height:1.55; }
.item:hover { text-decoration: underline; }

/* 弹窗遮罩层：改用flex全局居中 */
.mask {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 999;
    align-items: center;
    justify-content: center;
}
/* 弹窗盒子，移除旧margin，自动居中 */
.pop-box {
    width: 80%;
    max-width: 600px;
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    position: relative;
    margin: 0;
    max-height: 85vh;
    overflow-y: auto;
}
/* 关闭按钮 */
.close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 24px;
    cursor: pointer;
    color: #666;
}
.pop-text {
    word-break: break-all;
    line-height: 1.7;
}
/* 弹窗内链接：全部去掉下划线 */
.pop-text a {
    color: #0066cc;
    word-break: break-all;
    text-decoration: none;
}
.pop-text a:hover {
    text-decoration: none;
}
/* 搜索框样式 */
#search-input{
    width: 100%;
    box-sizing: border-box;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
    outline: none;
}
#search-input:focus{
    border-color:#662599;
}
.highlight{
    background-color:#fff280;
}
/* 底部图片样式 */
.footer-img{
    width: 100%;
    max-width: 600px;
    display: block;
    margin: 40px auto 20px;
    border-radius: 8px;
}

/* ============底部导航栏样式============ */
.nav-bar-wrap{
  position:fixed;
  bottom:20px;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
}
.nav-bar{
  display:flex;
  gap:0;
  background:#fff;
  border-radius:999px;
  border:1px solid #ffd6de;
  box-shadow:0 1px 3px rgba(255,102,128,0.08);
  overflow:hidden;
}
.nav-item{
  padding:14px 22px;
  color:#ff6680;
  font-size:18px;
  font-weight:500;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background-color 0.25s ease, color 0.25s ease;
}
.nav-item:hover{
  background:#fff0f3;
}
/* 点击临时高亮：变色时间缩短 */
.nav-item.click-highlight{
  background:#f8d7e0;
}
/* 禁用状态：使用class，div不支持原生disabled属性 */
.nav-item.is-disabled{
  color:#bbbbbb;
  cursor:not-allowed;
  background:transparent;
  pointer-events:none;
}
.nav-item a{
  color:#ff6680;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:4px;
}

</style>
</head>
<body>
<div class="tip">当前合集总数：<span id="countNum">加载中…</span> 
<br>点击名字进入，转存后去网盘下载/转存
</div>
<div class="divider"></div>
<input id="search-input" placeholder="🔍 输入关键词快速搜索资源名称...">

<!-- =========底部导航栏========= -->
<div class="nav-bar-wrap">
    <div class="nav-bar" style="width:88px; justify-content:center;">
        <div class="nav-item" style="width:100%;">
            <a href="./index.html" style="display:flex; width:100%; height:100%; align-items:center; justify-content:center;">
                <span class="arrow-icon">⌂</span>   </a> </div>
    </div>
</div>
<!-- 弹窗结构 -->
<div class="mask" id="mask">
    <div class="pop-box">
        <span class="close-btn" onclick="closePop()">×</span>
        <div class="pop-text" id="popContent"></div>
    </div>
</div>

<!-- 列表渲染容器 -->
<div id="listContainer"></div>

<script>
let list1 = [];
let list2 = [];
let list3 = [];

// 扁平化工具函数：接收groupData对象，返回一维数组
function flatGroupData(gData){
    let arr = [];
    for(let k in gData){
        arr = arr.concat(gData[k]);
    }
    return arr;
}
</script>

<!-- 1、加载author.js，读完立刻复制保存到list1 -->
<script src="js/sili.js"></script>
<script>
list1 = flatGroupData(window.groupData);
// 清空全局，防止干扰
window.groupData = null;
</script>

<!-- 2、加载type.js，读完立刻复制保存到list2 -->
<script src="js/author.js"></script>
<script>
list2 = flatGroupData(window.groupData);
window.groupData = null;
</script>

<!--3、加载sili.js，读完立刻复制保存到list3 -->
<script src="js/type.js"></script>
<script>
list3 = flatGroupData(window.groupData);
window.groupData = null;

//合并 list1 list2 list3 三个数组
window.allList = list1.concat(list2, list3);
window.totalCount = window.allList.length;
console.log("合并后总条数", window.totalCount);
</script>

<script>
const urlReg = /(https?:\/\/[^\s]+)/g;

function openPop(text){
    // 1、链接替换为文字“链接”
    let html = text.replace(urlReg, '<a href="$1" target="_blank">$1</a>');
    // 2、把换行回车\n转为网页换行<br>，完整保留原始换行排版
    html = html.replaceAll('\n', '<br>');
    document.getElementById('popContent').innerHTML = html;
    document.getElementById('mask').style.display = 'flex';
}
function closePop(){
    document.getElementById('mask').style.display = 'none';
}
document.getElementById('mask').onclick = function(e){
    if(e.target === this) closePop();
}

// 平铺渲染列表，无任何字母分组标题
function renderList(){
    document.getElementById('countNum').innerText = window.totalCount || 0;
    const container = document.getElementById('listContainer');
    let htmlStr = '';
    //直接循环全部合并后的条目
    window.allList.forEach(item=>{
        htmlStr += `<div class="item">📂 <span onclick="openPop(\`${item.url}\`)">${item.name}</span></div>\n`;
    })
    container.innerHTML = htmlStr;
}

// 页面全部资源加载完成渲染列表
window.onload = function(){
    renderList();
    bindSearch();
};

// 搜索逻辑不变，正常过滤条目
function bindSearch(){
    const input = document.getElementById('search-input');
    input.addEventListener('input', function(){
        let keyword = this.value.trim().toLowerCase();
        const itemList = document.querySelectorAll('.item');
        itemList.forEach(el=>{
            let text = el.textContent.toLowerCase();
            el.style.display = text.includes(keyword) ? 'block' : 'none';
        })
    })
}
</script>
</body>
</html>
