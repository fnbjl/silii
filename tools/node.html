<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='70'>🐟︎</text></svg>">
<title>吃饭工具</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui, sans-serif;
}

body{
  background:#f7f9fc;
  padding:14px 12px;
  line-height:1.7;
  font-size:15px;
  overflow-x:hidden;
  padding-bottom:90px;
}

.title-hd{
  font-size:25px;
  font-weight:bold;
  margin-bottom:16px;
}

.group-card{
  background:#fff0f3;
  border:1px solid #ffccd5;
  border-radius:16px;
  padding:12px;
  margin-bottom:20px;
  transition: padding 0.2s;
}
.group-card.collapsed{
  padding-bottom:0;
}

.group-header{
  font-size:22px;
  font-weight:bold;
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff0f3;
  margin-bottom:4px;
  user-select:none;
}

.arrow{
  font-size:16px;
  transition:transform 0.25s ease;
  color:#ff6680;
}

.arrow.collapsed{
  transform:rotate(90deg);
}

.group-content{
  overflow:hidden;
  transition:max-height 0.3s ease, opacity 0.3s ease;
  max-height:2000px;
  opacity:1;
  padding-top:6px;
  position:relative;
}

.group-content::before{
  content:"";
  display:block;
  height:1px;
  background:#ffccd5;
  margin:0 16px;
  position:absolute;
  top:0;
  left:0;
  right:0;
}

.group-content.hidden{
  max-height:0;
  opacity:0;
  pointer-events:none;
  padding-top:0;
  height:0;
}
.group-content.hidden::before{
  display:none;
}

.accel-item{
  margin-bottom:16px;
}

.label{
  font-size:20px;
  margin-bottom:4px;
  display:block;
  font-weight:500;
}

a{
  color:#0066cc;
  word-wrap:break-word;
  word-break:break-word;
  text-decoration:none;
}

.desc{
  color:#444;
  margin:4px 0 6px 0;
  font-size:14px;
}

.code{
  color:#c8102e;
  font-weight:bold;
}

.note{
  color:#666;
  font-size:13px;
}

/* 底部大导航条 左⬅｜中主页｜右➡ */
.nav-bar-wrap{
  position:fixed;
  bottom:20px;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
}
.nav-bar{
  display:flex;
  gap:0;
  background:#fff;
  border-radius:999px;
  border:1px solid #ffd6de;
  box-shadow:0 1px 3px rgba(255,102,128,0.08);
  overflow:hidden;
}
.nav-item{
  padding:10px 18px;
  color:#ff6680;
  font-size:18px;
  font-weight:500;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background 0.2s ease;
}
.nav-item:hover{
  background:#fff0f3;
}
.nav-item:disabled{
  opacity:0.4;
  cursor:not-allowed;
}
.nav-item a{
  color:#ff6680;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:4px;
}
</style>
</head>
<body>

<div class="title-hd">🍚吃饭工具</div>
<div id="container"></div>

<!-- 顺序：左⬅｜中主页｜右➡ -->
<div class="nav-bar-wrap">
  <div class="nav-bar">
    <div class="nav-item" id="prevBtn" onclick="goPrev()">⬅</div>
    <div class="nav-item"><a href="/"><span class="arrow-icon">⌂</span></a></div>
    <div class="nav-item" id="nextBtn" onclick="goNext()">➡</div>
  </div>
</div>

<script src="tools.js"></script>
<script>

const container = document.getElementById("container");
const cardDomList = [];

toolsData.forEach((group, index) => {
  let itemHtml = "";
  group.items.forEach(item => {
    itemHtml += `
      <div class="accel-item">
        <div class="label">${item.label}</div>
        ${item.html}
      </div>
    `;
  });

  const cardHtml = `
    <div class="group-card collapsed" data-index="${index}">
      <div class="group-header" onclick="toggleGroup(this)">
        <span>${group.title}</span>
        <span class="arrow collapsed">▼</span>
      </div>
      <div class="group-content hidden">
        ${itemHtml}
      </div>
    </div>
  `;
  container.innerHTML += cardHtml;
});

document.querySelectorAll('.group-card').forEach(card=>{
  cardDomList.push(card);
});

let currentIndex = 0;

// 切换：全部折叠，只打开目标卡片
function jumpTo(index){
  if(index < 0 || index >= cardDomList.length) return;
  currentIndex = index;

  cardDomList.forEach(card=>{
    card.classList.add("collapsed");
    card.querySelector(".group-content").classList.add("hidden");
    card.querySelector(".arrow").classList.add("collapsed");
  });

  const card = cardDomList[index];
  card.classList.remove("collapsed");
  card.querySelector(".group-content").classList.remove("hidden");
  card.querySelector(".arrow").classList.remove("collapsed");

  card.scrollIntoView({behavior:"smooth", block:"start"});
  updateBtnState();
}

function toggleGroup(el){
  const card = el.closest('.group-card');
  const content = el.nextElementSibling;
  const arrow = el.querySelector('.arrow');
  card.classList.toggle('collapsed');
  content.classList.toggle('hidden');
  arrow.classList.toggle('collapsed');
}

function updateBtnState(){
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  prevBtn.style.opacity = currentIndex <= 0 ? "0.4" : "1";
  nextBtn.style.opacity = currentIndex >= cardDomList.length -1 ? "0.4" : "1";
}

function goPrev(){
  if(currentIndex > 0){
    jumpTo(currentIndex -1);
  }
}

function goNext(){
  if(currentIndex < cardDomList.length -1){
    jumpTo(currentIndex +1);
  }
}

updateBtnState();
</script>

</body>
</html>
