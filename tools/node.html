<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='70'>🐟︎</text></svg>">
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui, sans-serif;
}
body{
  background:#f7f9fc;
  padding:14px;
  /* 底部预留空间，避免内容被固定按钮遮挡 */
  padding-bottom:80px;
  line-height:1.7;
  font-size:15px;
}
.page-title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:0px;
  padding:0 4px;
}
.page-title1{
  font-size:20px;
  font-weight:bold;
  margin-bottom:14px;
  padding:0 4px;
}
.page-title2{
  font-size:16px;
  font-weight:bold;
  margin-bottom:16px;
  padding:0 4px;
}  

.date-block{
  background:#ffe6ea;
  border:1px solid #ffccd5;
  border-radius:16px;
  padding:12px;
  margin-bottom:24px;
}
.main-date{
  font-size:22px;
  font-weight:bold;
  color:#222;
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff0f3;
  margin-bottom:12px;
  user-select:none;
}
.date-arrow{
  font-size:16px;
  transition:transform 0.25s ease;
  color:#ff6680;
}
.date-arrow.collapsed{
  transform:rotate(90deg);
}
.date-content{
  overflow:hidden;
  transition:max-height 0.3s ease, opacity 0.3s ease;
  max-height:2000px;
  opacity:1;
}
.date-content.hidden{
  max-height:0;
  opacity:0;
  pointer-events:none;
}
.title-hd{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
  padding:0 4px;
}
.code-wrap{
  position:relative;
  margin-bottom:18px;
}
.code-box{
  background:#222;
  color:#fff;
  padding:16px;
  border-radius:8px;
  overflow-x:auto;
}
.copy-btn{
  position:absolute;
  top:8px;
  right:8px;
  background:#555;
  color:#fff;
  border:none;
  padding:4px 10px;
  border-radius:4px;
  font-size:13px;
  cursor:pointer;
  z-index:2;
}
.url-text{
  white-space: nowrap;
  font-family: monospace;
}
.url-text::after{
  content:"";
  display:inline-block;
  width:55px;
}
/* 返回主页 固定置底，居中 */
.back-home-wrap{
  position:fixed;
  bottom:20px;
  left:0;
  width:100%;
  text-align:center;
}
.back-home {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 28px;
  background: #fff;
  color: #ff6680;
  text-decoration: none;
  border-radius: 999px;
  border: 1px solid #ffd6de;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 1px 3px rgba(255,102,128,0.08);
  transition: all 0.2s ease;
 
}
.back-home:hover {
  background: #fff0f3;
  border-color: #ffb3c1;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(255,102,128,0.15);
}
/* 注释掉图标左移动画，这就是漂移来源 */
/*.back-home:hover .arrow-icon{
  transform: translateX(-3px);
}*/
.arrow-icon{
  display: inline-block;
}


/* 所有a标签全部去掉下划线，深蓝色 #0f2b4d */
a {
  text-decoration: none;
  color: #2563eb;
}
</style>
</head>
<body>
<div class="page-title">免费节点订阅</div>
<div class="page-title1">Clash/V2Ray/SSR最新机场订阅</div>

<!-- 直接复用已有的 date-block 样式，无新增css -->
<div class="main-date" style="padding:6px 12px;flex-direction:column;align-items:flex-start;">
    <div class="page-title2" style="margin-bottom:0;"><a href="https://url46.ctfile.com/s/2b02971cf50feb61d3fcf0c6abb58ce0?p=123456" style="color:#000;">🔗直链下载地址：没数据换浏览器</a></div>
    <!-- margin‑top:8px 拉开两行文字距离，数值越大间距越大 -->
    <div class="page-title2" style="margin-bottom:0;margin-top:8px;"> <a href="https://pan.quark.cn/s/9378d5888f4b#/list/share" style="color:#000;">🔗夸克下载地址：不要在线解压，会和谐</a> </div>
 
  <div class="main-date" style="padding:6px 12px;margin-bottom:0;"><div class="page-title2" style="margin-bottom:0;"><a href="./tools.html" target="_blank" style="color:#000;">🧰吃饭工具</a> </div></div>
</div>

<div id="container"></div>
<!-- 返回主页【固定置底】 -->
<div class="back-home-wrap">
  <a href="/" class="back-home"><span class="arrow-icon">⌂</span></a>
</div>

<!-- 引入外部节点数据文件 -->
<script src="node.js"></script>
<script>
const container = document.getElementById("container");
// 渲染卡片，适配 window.groupData 数组格式
function renderList(){
  container.innerHTML = "";
  // 判断是否存在
  if(typeof window.groupData === 'undefined'){
    container.innerHTML = `<div style="text-align:center;color:red;padding:30px">⚠️数据加载异常，请检查JS语法</div>`;
    return;
  }
  let htmlStr = '';
  window.groupData.forEach(item => {
    let itemHtml = "";
    // 拿到下标 index，区分第1、第2条链接
    item.items.forEach((sub, index) => {
      let titleText = "";
      if(index === 0){
        titleText = "Clash/Mihomo免费节点订阅地址：";
      }else if(index === 1){
        titleText = "V2Ray免费节点订阅地址：";
      }
      itemHtml += `
      <div class="title-hd">${titleText}</div>
      <div class="code-wrap">
        <button class="copy-btn" onclick="copyText(this)">复制</button>
        <div class="code-box">
          <div class="url-text">${sub.url}</div>
        </div>
      </div>
      `;
    });
    htmlStr += `
<div class="date-block">
  <div class="main-date" onclick="toggleDate(this)">
    <span>📅 ${item.date}</span>
    <span class="date-arrow">▼</span>
  </div>
  <div class="date-content">
    ${itemHtml}
  </div>
</div>
    `;
  });
  container.innerHTML = htmlStr;
  // 初始化折叠：第一个展开，其余折叠
  const blocks = document.querySelectorAll('.date-block');
  for(let i=2;i<blocks.length;i++){
    const content = blocks[i].querySelector('.date-content');
    const arrow = blocks[i].querySelector('.date-arrow');
    content.classList.add('hidden');
    arrow.classList.add('collapsed');
  }
}
// 页面加载完成
document.addEventListener('DOMContentLoaded',()=>{
  renderList();
});
// 折叠切换
function toggleDate(el){
  const content = el.nextElementSibling;
  const arrow = el.querySelector('.date-arrow');
  content.classList.toggle('hidden');
  arrow.classList.toggle('collapsed');
}
// 复制
function copyText(btn){
  const urlDom = btn.closest('.code-wrap').querySelector('.url-text');
  const text = urlDom.innerText.trim();
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'absolute';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    btn.textContent = "已复制";
  } catch (e) {
    btn.textContent = "复制失败";
  }
  document.body.removeChild(ta);
  setTimeout(()=>{btn.textContent="复制"},1200);
}
</script>
</body>
</html>
