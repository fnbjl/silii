<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>吃饭工具</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui, sans-serif;
}

body{
  background:#f7f9fc;
  padding:14px 12px;
  line-height:1.7;
  font-size:15px;
  overflow-x:hidden;
}

.title-hd{
  font-size:25px;
  font-weight:bold;
  margin-bottom:16px;
  /* 删掉了 border-bottom 下划线 */
}

.group-card{
  background:#fff0f3;
  border:1px solid #ffccd5;
  border-radius:16px;
  padding:12px;
  margin-bottom:20px;
  transition: padding 0.2s;
}
.group-card.collapsed{
  padding-bottom:0;
}

.group-header{
  font-size:22px;
  font-weight:bold;
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff0f3;
  margin-bottom:4px;
  user-select:none;
}

.arrow{
  font-size:16px;
  transition:transform 0.25s ease;
  color:#ff6680;
}

.arrow.collapsed{
  transform:rotate(90deg);
}

.group-content{
  overflow:hidden;
  transition:max-height 0.3s ease, opacity 0.3s ease;
  max-height:2000px;
  opacity:1;
  padding-top:6px;
  position:relative;
}

.group-content::before{
  content:"";
  display:block;
  height:1px;
  background:#ffccd5;
  margin:0 16px;
  position:absolute;
  top:0;
  left:0;
  right:0;
}

.group-content.hidden{
  max-height:0;
  opacity:0;
  pointer-events:none;
  padding-top:0;
  height:0;
}
.group-content.hidden::before{
  display:none;
}

.accel-item{
  margin-bottom:16px;
}

.label{
  font-size:20px;
  margin-bottom:4px;
  display:block;
  font-weight:500;
}

a{
  color:#0066cc;
  word-wrap:break-word;
  word-break:break-word;
  text-decoration:none;
}

.desc{
  color:#444;
  margin:4px 0 6px 0;
  font-size:14px;
}

.code{
  color:#c8102e;
  font-weight:bold;
}

.note{
  color:#666;
  font-size:13px;
}
</style>
</head>
<body>

<div class="title-hd">🍚吃饭工具</div>
<div id="container"></div>

<!-- 引入外部数据文件 tools.js -->
<script src="tools.js"></script>
<script>
// 渲染卡片，读取tools.js里面的 toolsData
const container = document.getElementById("container");
toolsData.forEach(group => {
  let itemHtml = "";
  group.items.forEach(item => {
    itemHtml += `
      <div class="accel-item">
        <div class="label">${item.label}</div>
        ${item.html}
      </div>
    `;
  });

  const cardHtml = `
    <div class="group-card">
      <div class="group-header" onclick="toggleGroup(this)">
        <span>${group.title}</span>
        <span class="arrow">▼</span>
      </div>
      <div class="group-content">
        ${itemHtml}
      </div>
    </div>
  `;
  container.innerHTML += cardHtml;
});

// 折叠切换
function toggleGroup(el){
  const card = el.closest('.group-card');
  const content = el.nextElementSibling;
  const arrow = el.querySelector('.arrow');
  content.classList.toggle('hidden');
  arrow.classList.toggle('collapsed');
  card.classList.toggle('collapsed');
}
</script>

</body>
</html>
