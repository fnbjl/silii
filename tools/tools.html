<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='70'>🐟︎</text></svg>">
<title>吃饭工具</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui, sans-serif;
}

body{
  background:#f7f9fc;
  padding:14px 12px;
  line-height:1.7;
  font-size:15px;
  overflow-x:hidden;
  padding-bottom:90px;
}

.title-hd{
  font-size:25px;
  font-weight:bold;
  margin-bottom:16px;
}

.group-card{
  background:#fff0f3;
  border:1px solid #ffccd5;
  border-radius:16px;
  padding:12px;
  margin-bottom:20px;
  transition: padding 0.2s;
}
.group-card.collapsed{
  padding-bottom:0;
}

.group-header{
  font-size:22px;
  font-weight:bold;
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff0f3;
  margin-bottom:4px;
  user-select:none;
}

.arrow{
  font-size:16px;
  transition:transform 0.25s ease;
  color:#ff6680;
}

.arrow.collapsed{
  transform:rotate(90deg);
}

.group-content{
  overflow:hidden;
  transition:max-height 0.3s ease, opacity 0.3s ease;
  max-height:2000px;
  opacity:1;
  padding-top:6px;
  position:relative;
}

.group-content::before{
  content:"";
  display:block;
  height:1px;
  background:#ffccd5;
  margin:0 16px;
  position:absolute;
  top:0;
  left:0;
  right:0;
}

.group-content.hidden{
  max-height:0;
  opacity:0;
  pointer-events:none;
  padding-top:0;
  height:0;
}
.group-content.hidden::before{
  display:none;
}

.accel-item{
  margin-bottom:16px;
}

.label{
  font-size:20px;
  margin-bottom:4px;
  display:block;
  font-weight:500;
}

a{
  color:#0066cc;
  word-wrap:break-word;
  word-break:break-word;
  text-decoration:none;
}

.desc{
  color:#444;
  margin:4px 0 6px 0;
  font-size:14px;
}

.code{
  color:#c8102e;
  font-weight:bold;
}

.note{
  color:#666;
  font-size:13px;
}

.code-wrap{
  display:inline-block;
  position:relative;
  padding-right:54px; /* 给悬浮按钮预留空间 */
}
.copy-btn{
  font-size:13px;
  padding:3px 8px;
  background:#888888;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
}
.copy-btn:active{
  background:#666666;
}

.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.75);
  color:#fff;
  padding:8px 16px;
  border-radius:8px;
  font-size:14px;
  z-index:9999;
  opacity:0;
  transition:opacity 0.2s;
  pointer-events:none;
}
.toast.show{
  opacity:1;
}

.nav-bar-wrap{
  position:fixed;
  bottom:20px;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
}
.nav-bar{
  display:flex;
  gap:0;
  background:#fff;
  border-radius:999px;
  border:1px solid #ffd6de;
  box-shadow:0 1px 3px rgba(255,102,128,0.08);
  overflow:hidden;
}
.nav-item{
  padding:14px 22px;
  color:#ff6680;
  font-size:18px;
  font-weight:500;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background 0.2s ease;
}
.nav-item:hover{
  background:#fff0f3;
}
.nav-item:disabled{
  opacity:0.4;
  cursor:not-allowed;
}
.nav-item a{
  color:#ff6680;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:4px;
}
</style>
</head>
<body>

<div class="title-hd">🍚吃饭工具</div>
<div id="container"></div>

<div class="toast" id="toast">复制成功</div>

<div class="nav-bar-wrap">
  <div class="nav-bar">
    <div class="nav-item" id="prevBtn" onclick="goPrev()">⬅</div>
    <div class="nav-item"><a href="/"><span class="arrow-icon">⌂</span></a></div>
    <div class="nav-item" id="nextBtn" onclick="goNext()">➡</div>
  </div>
</div>

<script src="tools.js"></script>
<script>
const container = document.getElementById('container');
const toastEl = document.getElementById('toast');
let cardDomList = [];

// 渲染工具列表
toolsData.forEach((group, index) => {
  let itemHtml = '';
  group.items.forEach(item => {
    itemHtml += `<div class="accel-item">
      <div class="label">${item.label}</div>
      ${item.html}
    </div>`;
  });

  const cardHtml = `
    <div class="group-card collapsed" data-index="${index}">
      <div class="group-header" onclick="toggleGroup(this)">
        <span>${group.title}</span>
        <span class="arrow collapsed">▼</span>
      </div>
      <div class="group-content hidden">
        ${itemHtml}
      </div>
    </div>
  `;
  container.innerHTML += cardHtml;
});

cardDomList = Array.from(document.querySelectorAll('.group-card'));

function autoInjectCopyButtons(){
  const codeWraps = document.querySelectorAll('.code-wrap');
  codeWraps.forEach(wrap => {
    const codeEl = wrap.querySelector('.code');
    if (!codeEl) return;
    if (wrap.querySelector('.copy-btn')) return;

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'copy';

    btn.addEventListener('click', () => {
      const text = codeEl.innerText.trim();
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'absolute';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        btn.textContent = "已复制";
        showToast("复制成功");
      } catch (e) {
        btn.textContent = "复制失败";
        showToast("复制失败，请手动复制");
      }
      document.body.removeChild(ta);
      setTimeout(() => {
        btn.textContent = "copy";
      }, 1200);
    });

    wrap.appendChild(btn);
  });
}

autoInjectCopyButtons();

function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add('show');
  setTimeout(()=>{
    toastEl.classList.remove('show');
  },1200);
}

let currentIndex = 0;

// 统一函数：只打开指定index卡片，其余全部关闭
function openOnlyCard(index){
  if(index <0 || index >= cardDomList.length) return;
  currentIndex = index;

  cardDomList.forEach((card, i)=>{
    if(i === index){
      card.classList.remove("collapsed");
      card.querySelector(".group-content").classList.remove("hidden");
      card.querySelector(".arrow").classList.remove("collapsed");
    }else{
      card.classList.add("collapsed");
      card.querySelector(".group-content").classList.add("hidden");
      card.querySelector(".arrow").classList.add("collapsed");
    }
  });

  cardDomList[index].scrollIntoView({behavior:"smooth", block:"start"});
  updateBtnState();
}

function jumpTo(index){
  openOnlyCard(index);
}

// 点击卡片标题
function toggleGroup(el){
  const card = el.closest('.group-card');
  const idx = Number(card.dataset.index);
  openOnlyCard(idx);
}

function updateBtnState(){
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  // 到第一个卡片，上一页置灰；到最后一个卡片，下一页置灰
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === cardDomList.length - 1;
}

function goPrev(){
  if(currentIndex > 0){
    jumpTo(currentIndex -1);
  }
}

function goNext(){
  // 判断是否没有任何卡片打开
  const anyOpen = cardDomList.some(c=>!c.classList.contains('collapsed'));
  if(!anyOpen){
    // 全部关闭，按下一个默认打开第一个
    jumpTo(0);
    return;
  }
  if(currentIndex < cardDomList.length -1){
    jumpTo(currentIndex +1);
  }
}

updateBtnState();
</script>

</body>
</html>
