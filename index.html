.qr-wrap{
    text-align:center;    /* 二维码整体居中 */

}
.qr-wrap img{
    width:260px;          /* 二维码图片固定宽度260像素，不会过大 */
}
.bottom-tip{
    text-align:center;    /* 底部文字居中 */
    margin-top:30px;      /* 和上面内容隔开30像素 */
