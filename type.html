<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说-类型索引</title>
<style>
body { max-width:920px; margin:24px auto; padding:0 14px; font-size:16px; }
.tip { text-align:center; margin:24px 0; }
 /* 仅公告段落两端对齐，末尾居左 */
.tip-notice{
    text-align: justify;
    margin-top:6px;
    padding:0 8px;
}
.divider { border-bottom:1px solid #aaa; margin-bottom:20px; }
.group-title { font-weight:bold; font-size:17px; margin-top:28px; }
.item { margin: 9px 0; cursor: pointer; color:#0000cc; line-height:1.55; }
.item:hover { text-decoration: underline; }

/* 弹窗遮罩层：改用flex全局居中 */
.mask {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 999;
    /* 核心居中代码 */
    align-items: center;
    justify-content: center;
}
/* 弹窗盒子，移除旧margin，自动居中 */
.pop-box {
    width: 80%;
    max-width: 600px;
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    position: relative;
    /* 清除之前居中的margin */
    margin: 0;
    /* 超长内容自动滚动 */
    max-height: 85vh;
    overflow-y: auto;
}
/* 关闭按钮 */
.close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 24px;
    cursor: pointer;
    color: #666;
}
.pop-text {
    word-break: break-all;
    line-height: 1.7;
}
/* 弹窗内链接样式 */
.pop-text a {
    color: #0066cc;
    word-break: break-all;
}
.pop-text a:hover {
    text-decoration: underline;
}
/* 搜索框样式 */
#search-input{
    width: 100%;
    box-sizing: border-box;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
    outline: none;
}
#search-input:focus{
    border-color:#662599;
}
.highlight{
    background-color:#fff280;
}
/* 底部图片样式 */
.footer-img{
    width: 100%;
    max-width: 600px;
    display: block;
    margin: 40px auto 20px;
    border-radius: 8px;
}
</style>
</head>
<body>
<div class="tip">
<br>当前合集总数：<span id="countNum">0</span>
<!-- <br>公告：点击名字弹窗进入，转存后去网盘下载/转存；如果遇到禁止访问/加载缓慢就换夸克、Edge等浏览器。-->
<div class="tip-notice">
公告：点击名字弹窗进入，转存后去网盘下载/转存；如果遇到禁止访问/加载缓慢就换夸克/Edge/360/夸克/UC/谷歌浏览器等。
</div>
</div>
<div class="divider"></div>
<input id="search-input" placeholder="🔍 输入关键词快速搜索资源名称...">
    
<div class="item">📋<a href="https://fnbjl.github.io/silii/rule.html" target="_blank">🫧教程：已经很详细了，不懂自己看</a></div>

<!-- 弹窗结构 -->
<div class="mask" id="mask">
    <div class="pop-box">
        <span class="close-btn" onclick="closePop()">×</span>
        <div class="pop-text" id="popContent"></div>
    </div>
</div>

<!-- 列表渲染容器 -->
<div id="listContainer"></div>

<!-- ==========页面底部图片区域========== -->
<!-- 关键点：去掉src，使用data-src存图片地址，初始不会发起图片请求 -->
<img class="footer-img" data-src="qrcode.jpg" alt="等待加载">




<!-- 优先加载数据源 -->
<script src="js/type.js"></script>
<script>
const urlReg = /(https?:\/\/[^\s]+)/g;

function openPop(text){
    // 1、链接替换为文字“链接”
    let html = text.replace(urlReg, '<a href="$1" target="_blank">链接</a>');
    // 2、把换行回车\n转为网页换行<br>，完整保留原始换行排版
    html = html.replaceAll('\n', '<br>');
    document.getElementById('popContent').innerHTML = html;
    document.getElementById('mask').style.display = 'flex';
}
function closePop(){
    document.getElementById('mask').style.display = 'none';
}
document.getElementById('mask').onclick = function(e){
    if(e.target === this) closePop();
}

// 渲染列表函数
function renderList(){
    // 填充总数
    document.getElementById('countNum').innerText = window.totalCount || 0;
    const container = document.getElementById('listContainer');
    let htmlStr = '';
    for (const key in groupData) {
        htmlStr += `<div class="group-title">【${key}】</div>\n`;
        const list = groupData[key];
        list.forEach(item=>{
            htmlStr += `<div class="item">📂 <span onclick="openPop(\`${item.url}\`)">${item.name}</span></div>\n`;
        })
    }
    container.innerHTML = htmlStr;

    // ✅列表渲染**完成之后，才开始加载图片**
    const footerImg = document.querySelector('.footer-img');
    if(footerImg.dataset.src){
        footerImg.src = footerImg.dataset.src;
    }
}

// 【重点】DOMContentLoaded：DOM、js加载完立刻执行，**不等图片**
document.addEventListener('DOMContentLoaded',function(){
    renderList();
    // 列表渲染完成后，再绑定搜索事件
    bindSearch();
});

// 封装搜索绑定函数
// 封装搜索绑定函数【搜索时完全隐藏分组标题】
function bindSearch(){
    const input = document.getElementById('search-input');
    if(!input) return;
    let timer = null;
    input.addEventListener('input', function(){
        const keyword = this.value.trim().toLowerCase();
        clearTimeout(timer);
        timer = setTimeout(()=>{
            const allItems = document.querySelectorAll('.item');
            const allGroupTitles = document.querySelectorAll('.group-title');

            // 清空输入框：全部恢复
            if(keyword === ''){
                allItems.forEach(el=> el.style.display = 'block');
                allGroupTitles.forEach(el=> el.style.display = 'block');
                return;
            }

            // 有搜索关键词：全部分组标题隐藏
            allGroupTitles.forEach(el=> el.style.display = 'none');

            // 筛选条目，只显示匹配的
            allItems.forEach(el=>{
                const text = el.textContent.toLowerCase();
                el.style.display = text.includes(keyword) ? 'block' : 'none';
            });

        },300)
    })
}

</script>
</body>
</html>
