<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作者索引</title>
<style>
body { max-width:920px; margin:24px auto; padding:0 14px; font-size:16px; }
.tip { text-align:center; margin:24px 0; }
.divider { border-bottom:1px solid #aaa; margin-bottom:20px; }
.group-title { font-weight:bold; font-size:17px; margin-top:28px; }
.item { margin: 9px 0; cursor: pointer; color:#0000cc; line-height:1.55; }
.item:hover { text-decoration: underline; }

/* 弹窗遮罩层：改用flex全局居中 */
.mask {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 999;
    /* 核心居中代码 */
    display: none;
    align-items: center;
    justify-content: center;
}
/* 弹窗盒子，移除旧margin，自动居中 */
.pop-box {
    width: 80%;
    max-width: 600px;
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    position: relative;
    /* 清除之前居中的margin */
    margin: 0;
    /* 超长内容自动滚动 */
    max-height: 85vh;
    overflow-y: auto;
}
/* 关闭按钮 */
.close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 24px;
    cursor: pointer;
    color: #666;
}
.pop-text {
    word-break: break-all;
    line-height: 1.7;
}
/* 弹窗内链接样式 */
.pop-text a {
    color: #0066cc;
    word-break: break-all;
}
.pop-text a:hover {
    text-decoration: underline;
}
/* 搜索框样式 */
#search-input{
    width: 100%;
    box-sizing: border-box;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
    outline: none;
}
#search-input:focus{
    border-color:#662599;
}
.highlight{
    background-color:#fff280;
}
/* 底部图片样式 */
.footer-img{
    width: 100%;
    max-width: 600px;
    display: block;
    margin: 40px auto 20px;
    border-radius: 8px;
}
</style>
</head>
<body>
<div class="tip">
【温馨提示】<br>当前合集总数：<span id="countNum">0</span> 个
<br>点击名字进入，转存后去网盘下载/转存
</div>
<div class="divider"></div>
<input id="search-input" placeholder="🔍 输入关键词快速搜索资源名称...">

<div class="group-title">【目录】</div>
<div class="item">📋<a href="https://docs.qq.com/doc/DQ0pvTkF4U0F4QXNn#" target="_blank">一、在线目录|缓存很久，建议下载二</a></div>
<div class="item">📋 <a href="https://www.kdocs.cn/l/cb8eZIQQZ7PD" target="_blank">二、txt目录|可下载至本地</a></div>

<!-- 弹窗结构 -->
<div class="mask" id="mask">
    <div class="pop-box">
        <span class="close-btn" onclick="closePop()">×</span>
        <div class="pop-text" id="popContent"></div>
    </div>
</div>

<!-- 列表渲染容器 -->
<div id="listContainer"></div>

<!-- ==========页面底部图片区域========== -->
<img class="footer-img" src="/qrcode.jpg" alt="底部配图">




<!-- 优先加载数据源 -->
<script src="data.js"></script>
<script>
const urlReg = /(https?:\/\/[^\s]+)/g;

function openPop(text){
    // 1、链接替换为文字“链接”
    let html = text.replace(urlReg, '<a href="$1" target="_blank">链接</a>');
    // 2、把换行回车\n转为网页换行<br>，完整保留原始换行排版
    html = html.replaceAll('\n', '<br>');
    document.getElementById('popContent').innerHTML = html;
    document.getElementById('mask').style.display = 'flex';
}
function closePop(){
    document.getElementById('mask').style.display = 'none';
}
document.getElementById('mask').onclick = function(e){
    if(e.target === this) closePop();
}

// 渲染列表函数
function renderList(){
    // 填充总数
    document.getElementById('countNum').innerText = window.totalCount || 0;
    const container = document.getElementById('listContainer');
    let htmlStr = '';
    for (const key in groupData) {
        htmlStr += `<div class="group-title">【${key}】</div>\n`;
        const list = groupData[key];
        list.forEach(item=>{
            htmlStr += `<div class="item">📂 <span onclick="openPop(\`${item.url}\`)">${item.name}</span></div>\n`;
        })
    }
    container.innerHTML = htmlStr;
}

// 页面加载完成渲染列表
window.onload = function(){
    renderList();
    // 列表渲染完成后，再绑定搜索事件
    bindSearch();
};

// 封装搜索绑定函数
function bindSearch(){
    const input = document.getElementById('search-input');
    input.addEventListener('input', function(){
        let keyword = this.value.trim().toLowerCase();
        // 每次输入实时重新获取最新条目
        const itemList = document.querySelectorAll('.item');
        itemList.forEach(el=>{
            let text = el.textContent.toLowerCase();
            el.style.display = text.includes(keyword) ? 'block' : 'none';
        })
    })
}
</script>
</body>
</html>
