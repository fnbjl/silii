<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='70'>🐟︎</text></svg>">
<title>作者索引</title>
<style>
*{
  box-sizing: border-box;
}
html,body{
  overflow-x: hidden; /* 禁止横向滚动，解决往右无限划 */
}
body{ 
   max-width:920px;
   margin:6px auto; 
   padding:0 14px; 
   padding-bottom:80px;
   font-size:16px; }
.tip { text-align:center; margin:15px 0; }
 /* 仅公告段落两端对齐，末尾居左 */
.tip-notice{
    text-align: justify;
    margin-top:6px;
    padding:0 8px;
    word-break: break-all;
}
.divider { border-bottom:1px solid #aaa; margin-bottom:20px; }
.group-title { font-weight:bold; font-size:17px; margin-top:28px; }
.item { 
  margin: 9px 0; 
  cursor: pointer; 
  color:#0000cc; 
  line-height:1.55;
  word-break: break-all; /* 长文字强制换行，不会撑宽页面 */
}
.item:hover { text-decoration: underline; }

/* 弹窗遮罩层：改用flex全局居中 */
.mask {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.6);
    z-index: 999;
    align-items: center;
    justify-content: center;
}
/* 弹窗盒子 */
.pop-box {
    width: 80%;
    max-width: 600px;
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    position: relative;
    margin: 0;
    max-height: 85vh;
    overflow-y: auto;
}
/* 关闭按钮 */
.close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 24px;
    cursor: pointer;
    color: #666;
}
.pop-text {
    word-break: break-all;
    line-height: 1.7;
}
/* 弹窗内链接样式 */
.pop-text a {
    color: #0066cc;
    word-break: break-all;
}
.pop-text a:hover {
    text-decoration: underline;
}
/* 搜索框样式 */
#search-input{
    width: 100%;
    box-sizing: border-box;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
    outline: none;
}
#search-input:focus{
    border-color:#662599;
}
.highlight{
    background-color:#fff280;
}
 /* ============底部导航栏样式============ */
.nav-bar-wrap{
  position:fixed;
  bottom:20px;
  left:0;
  width:100vw;
  display:flex;
  justify-content:center;
}
.nav-bar{
    display:flex;
    gap:0;
    background:#fff;
    border-radius:999px;
    border:1px solid #ffd6de;
    box-shadow:0 1px 3px rgba(255,102,128,0.08);
    overflow:hidden;
}
.nav-item{
  padding:14px 22px;
  color:#ff6680;
  font-size:18px;
  font-weight:500;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background-color 0.25s ease, color 0.25s ease;
}
.nav-item:hover{
  background:#fff0f3;
}
.nav-item.click-highlight{
  background:#f8d7e0;
}
.nav-item.is-disabled{
  color:#bbbbbb;
  cursor:not-allowed;
  background:transparent;
  pointer-events:none;
}
.nav-item a{
  color:#ff6680;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:4px;
}
a {
  text-decoration: none;
  color: #000204;
} 
</style>
</head>
<body>
<div class="tip">当前合集总数：<span id="countNum">加载中…</span>
<div class="tip-notice">公告：①点击名字弹窗进入，转存后去网盘下载/转存②如果遇到禁止访问或加载缓慢，就换夸克/Edge/360/夸克/UC/谷歌浏览器等。
</div>
</div>
<div class="divider"></div>
<input id="search-input" placeholder="🔍 输入关键词快速搜索资源名称...">
    
<div class="item">📋<a href="https://fnbjl.github.io/silii/rule.html" target="_blank">🫧教程：已经很详细了，不懂自己看</a></div>
<div class="group-title">【目录】</div>
<div class="item">📋<a href="https://docs.qq.com/doc/DQ0pvTkF4U0F4QXNn#" target="_blank">一、在线目录|缓存很久，建议下载二</a></div>
<div class="item">📋 <a href="https://www.kdocs.cn/l/cb8eZIQQZ7PD" target="_blank">二、txt目录|可下载至本地</a></div>

<!-- 返回主页【固定置底】 -->
<div class="nav-bar-wrap">
    <div class="nav-bar" style="width:88px; justify-content:center;">
        <div class="nav-item" style="width:100%;">
            <a href="./index.html" style="display:flex; width:100%; height:100%; align-items:center; justify-content:center;">
                <span class="arrow-icon">⌂</span>   </a> </div>
    </div>
</div>

<div class="mask" id="mask">
    <div class="pop-box">
        <span class="close-btn" onclick="closePop()">×</span>
        <div class="pop-text" id="popContent"></div>
    </div>
</div>

<div id="listContainer"></div>

<img class="footer-img" data-src="qrcode.jpg" alt="等待刷新">

<script src="js/author.js"></script>
<script>
const urlReg = /(https?:\/\/[^\s]+)/g;

function openPop(text){
    let html = text.replace(urlReg, '<a href="$1" target="_blank">$1</a>');
    html = html.replaceAll('\n', '<br>');
    document.getElementById('popContent').innerHTML = html;
    document.getElementById('mask').style.display = 'flex';
}
function closePop(){
    document.getElementById('mask').style.display = 'none';
}
document.getElementById('mask').onclick = function(e){
    if(e.target === this) closePop();
}

function renderList(){
    document.getElementById('countNum').innerText = window.totalCount || 0;
    const container = document.getElementById('listContainer');
    let htmlStr = '';
    for (const key in groupData) {
        htmlStr += `<div class="group-title">【${key}】</div>\n`;
        const list = groupData[key];
        list.forEach(item=>{
            htmlStr += `<div class="item">📂 <span onclick="openPop(\`${item.url}\`)">${item.name}</span></div>\n`;
        })
    }
    container.innerHTML = htmlStr;

    const footerImg = document.querySelector('.footer-img');
    if(footerImg.dataset.src){
        footerImg.src = footerImg.dataset.src;
    }
}

document.addEventListener('DOMContentLoaded',function(){
    renderList();
    bindSearch();
});

function bindSearch(){
    const input = document.getElementById('search-input');
    if(!input) return;
    let timer = null;
    input.addEventListener('input', function(){
        const keyword = this.value.trim().toLowerCase();
        clearTimeout(timer);
        timer = setTimeout(()=>{
            const allItems = document.querySelectorAll('.item');
            const allGroupTitles = document.querySelectorAll('.group-title');

            if(keyword === ''){
                allItems.forEach(el=> el.style.display = 'block');
                allGroupTitles.forEach(el=> el.style.display = 'block');
                return;
            }

            allGroupTitles.forEach(el=> el.style.display = 'none');
            allItems.forEach(el=>{
                const text = el.textContent.toLowerCase();
                el.style.display = text.includes(keyword) ? 'block' : 'none';
            });

        },300)
    })
}
</script>
</body>
</html>
